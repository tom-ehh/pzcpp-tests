<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- top: end-to-end / UI -->
  <polygon points="250,30 350,30 390,110 210,110" fill="#f4a3a3" stroke="#7a2e2e" stroke-width="2"/>
  <text x="300" y="68" text-anchor="middle" font-size="15" fill="#3a1010">Testy E2E / UI</text>
  <text x="300" y="88" text-anchor="middle" font-size="12" fill="#3a1010">kilka</text>
  <!-- middle: integration -->
  <polygon points="210,110 390,110 440,200 160,200" fill="#f7d68a" stroke="#7a5a12" stroke-width="2"/>
  <text x="300" y="150" text-anchor="middle" font-size="15" fill="#3a2a05">Testy integracyjne</text>
  <text x="300" y="170" text-anchor="middle" font-size="12" fill="#3a2a05">więcej</text>
  <!-- bottom: unit -->
  <polygon points="160,200 440,200 490,290 110,290" fill="#9fd8a5" stroke="#2d6a34" stroke-width="2"/>
  <text x="300" y="240" text-anchor="middle" font-size="15" fill="#0f3314">Testy jednostkowe</text>
  <text x="300" y="260" text-anchor="middle" font-size="12" fill="#0f3314">najwięcej</text>
  <!-- left axis: speed/cost -->
  <line x1="70" y1="290" x2="70" y2="40" stroke="#333333" stroke-width="2"/>
  <polygon points="70,30 63,46 77,46" fill="#333333"/>
  <text x="58" y="165" text-anchor="middle" font-size="13" fill="#333333" transform="rotate(-90 58 165)">wolniejsze, droższe</text>
  <!-- right axis: isolation -->
  <line x1="560" y1="40" x2="560" y2="290" stroke="#333333" stroke-width="2"/>
  <polygon points="560,300 553,284 567,284" fill="#333333"/>
  <text x="575" y="165" text-anchor="middle" font-size="13" fill="#333333" transform="rotate(90 575 165)">mniejsze, bardziej odizolowane</text>
  <text x="300" y="318" text-anchor="middle" font-size="12" fill="#555555">Piramida testów (M. Cohn): im wyżej, tym mniej testów</text>
</svg>
